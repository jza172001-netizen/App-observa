<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa · La cadena, comuna por comuna · Observa Rigor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#0E0A18;--glass:rgba(22,15,36,.78);--glass2:rgba(34,24,54,.86);--borde:rgba(255,255,255,.1);--txt:#F6F1FF;--suave:#B7AECB;--sol:#FFC93C;--nar:#FF8A3D;--rosa:#FF4F8B;
 --grad:linear-gradient(115deg,#FFC93C 0%,#FF8A3D 45%,#FF4F8B 100%);color-scheme:dark;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{position:fixed;inset:0;width:100%}
body{background:var(--bg);color:var(--txt);font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
#map{position:absolute;inset:0}
button{font:inherit;color:inherit}a{color:var(--sol)}button:focus-visible,a:focus-visible{outline:2px solid var(--sol);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--borde);box-shadow:0 20px 60px rgba(0,0,0,.45)}
.mono{font-family:'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;font-size:.66rem}
/* barra superior */
.top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;align-items:center;gap:10px;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.marca{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--txt);font-weight:700}
.marca i{width:10px;height:10px;border-radius:50%;background:var(--grad);box-shadow:0 0 14px #FF4F8B}
.marca small{color:var(--suave);font-weight:400}
.ctrls{margin-left:auto;display:flex;gap:6px;padding:5px;border-radius:999px}
.ctrls button{border:0;background:transparent;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:.82rem;white-space:nowrap}
.ctrls button[aria-pressed="true"]{background:var(--grad);color:#1a0f22;font-weight:700}
.ctrls button:hover{background:rgba(255,255,255,.08)}
/* panel lateral */
.panel{position:absolute;top:calc(70px + env(safe-area-inset-top,0px));left:12px;bottom:150px;width:380px;border-radius:24px;z-index:4;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--borde)}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:12px;cursor:pointer;font-size:.82rem;color:var(--suave)}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.1);color:var(--txt);font-weight:700}
.cuerpo{overflow:auto;padding:14px 16px 18px;flex:1;scrollbar-width:thin}
.cuerpo h2{font-family:'Fraunces',serif;font-size:1.5rem;margin:0 0 4px;line-height:1.1}
.cuerpo h3{font-size:1rem;margin:14px 0 6px}
.sub{color:var(--suave);font-size:.8rem;margin:0 0 10px}
.grupo{margin-bottom:10px}.grupo .mono{color:var(--sol);margin-bottom:6px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--borde);background:rgba(255,255,255,.04);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:.8rem}
.chips button[aria-pressed="true"]{background:var(--grad);color:#1a0f22;border-color:transparent;font-weight:700}
.rampa{height:8px;border-radius:4px;margin:10px 0 4px;background:linear-gradient(90deg,#3b2a5c,#FFC93C,#FF8A3D,#FF4F8B)}
.ext{display:flex;justify-content:space-between;font-size:.74rem;color:var(--suave)}
.que{font-size:.82rem;color:var(--suave);margin:6px 0 0}
.fte{font-size:.7rem;color:var(--suave);margin:8px 0 0}.fte a{color:var(--sol)}
.lugarbox{margin-top:14px;padding-top:14px;border-top:1px solid var(--borde)}
.cifras{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cifra{background:rgba(255,255,255,.05);border:1px solid var(--borde);border-radius:14px;padding:10px}
.cifra b{display:block;font-size:1.25rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cifra small{color:var(--suave);font-size:.72rem;line-height:1.25;display:block}
.simple{margin:12px 0 0;padding:0 0 0 16px;font-size:.84rem}.simple li{margin:4px 0}
/* hallazgos */
.hall{border:1px solid var(--borde);border-radius:18px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.03)}
.hall .n{font-family:'Fraunces',serif;font-weight:900;font-size:2rem;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hall h4{margin:6px 0 4px;font-size:1rem}.hall p{margin:0;color:var(--suave);font-size:.84rem}
.ir{margin-top:10px;border:0;padding:8px 14px;border-radius:999px;background:var(--grad);color:#1a0f22;font-weight:700;cursor:pointer;font-size:.8rem}
.mini{margin-top:10px}.mini .b{display:grid;grid-template-columns:1fr 80px 46px;gap:6px;align-items:center;font-size:.72rem;margin:3px 0}
.mini .t{height:6px;border-radius:3px;background:rgba(255,255,255,.08);display:block;overflow:hidden}.mini .t i{display:block;height:100%;background:var(--grad);border-radius:3px}
.mini .v{text-align:right;font-variant-numeric:tabular-nums}.mini .nota{display:none}
.mini h3,.mini .sub,.mini .conclu,.mini .fte{display:none}
/* ranking */
.rk{width:100%;display:grid;grid-template-columns:20px 1fr 70px 54px;gap:6px;align-items:center;border:0;background:transparent;padding:5px 4px;border-radius:8px;cursor:pointer;font-size:.8rem;text-align:left}
.rk:hover,.rk.yo{background:rgba(255,255,255,.07)}.rk em{font-style:normal;color:var(--suave);font-size:.7rem}
.rk .t{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.rk .t i{display:block;height:100%;background:var(--grad)}.rk .v{text-align:right}
/* tira de lugares */
.tira{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;gap:10px;overflow-x:auto;padding:4px 2px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.tira::-webkit-scrollbar{display:none}
.lc{flex:0 0 200px;height:120px;border-radius:18px;overflow:hidden;position:relative;cursor:pointer;scroll-snap-align:start;border:1px solid var(--borde);background:#221836;padding:0;text-align:left;transition:transform .25s}
.lc:hover{transform:translateY(-4px)}.lc img{width:100%;height:100%;object-fit:cover;display:block}
.lc span{position:absolute;inset:auto 0 0 0;padding:20px 10px 8px;font-size:.82rem;font-weight:700;background:linear-gradient(transparent,rgba(10,6,18,.9))}
.lc.sinfoto{display:flex;align-items:flex-end;background:linear-gradient(135deg,#2a1d45,#4a2440)}
/* cajón de lugar */
.cajon{position:absolute;top:calc(70px + env(safe-area-inset-top,0px));right:12px;width:360px;max-height:calc(100% - 230px);border-radius:24px;z-index:6;overflow:auto;transform:translateX(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.cajon:not(.on){visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}.cajon.on{transform:none}
.cajon img{width:100%;height:210px;object-fit:cover;display:block}
.cajon .in{padding:14px 16px 16px}.cajon h2{font-family:'Fraunces',serif;font-size:1.5rem;margin:0 0 6px}
.cajon p{margin:0 0 6px;font-size:.88rem;color:#E6DEF5}
.cajon .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(10,6,18,.7);cursor:pointer;font-size:1.1rem}
.acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.acc button,.acc a{border:1px solid var(--borde);background:rgba(255,255,255,.05);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:.78rem;text-decoration:none;color:var(--txt)}
.cred{font-size:.62rem;color:var(--suave);padding:6px 16px 0}.cred a{color:var(--suave)}
/* marcadores */
.pin{display:flex;flex-direction:column;align-items:center;cursor:pointer;transform-origin:bottom center;transition:transform .2s}
.pin:hover{transform:scale(1.08)}
.pin .ph{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#2a1d45 center/cover;box-shadow:0 0 0 3px rgba(255,79,139,.6),0 8px 20px rgba(0,0,0,.5)}
.pin .dot{width:14px;height:14px;border-radius:50%;background:var(--grad);border:2px solid #fff;box-shadow:0 0 16px #FF4F8B}
.pin b{margin-top:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(14,10,24,.82);white-space:nowrap;border:1px solid var(--borde)}
.pin:after{content:'';width:2px;height:10px;background:linear-gradient(#fff,transparent)}
.lejos .pin.r2 b,.lejos .pin.r3 b,.muylejos .pin.r3{display:none}
.lejos .pin.r2 .ph,.lejos .pin.r3 .ph{width:30px;height:30px}
/* intro */
.intro{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,79,139,.25),transparent 60%),var(--bg);transition:opacity .8s}
.intro.fuera{opacity:0;pointer-events:none}
.intro h1{font-family:'Fraunces',serif;font-size:clamp(2.4rem,7vw,5rem);margin:0;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro p{text-align:center;color:var(--suave);margin:10px 0 0}
.barra{width:180px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin:22px auto 0;overflow:hidden}.barra i{display:block;height:100%;width:40%;background:var(--grad);animation:carga 1.2s infinite ease-in-out}
@keyframes carga{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.busca{position:relative;flex:0 1 360px}.busca input{width:100%;border:1px solid var(--borde);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--txt);padding:11px 16px 11px 40px;border-radius:999px;font:inherit;font-size:.9rem;outline:none}
.busca input:focus{border-color:var(--sol);box-shadow:0 0 0 3px rgba(255,201,60,.18)}.busca:before{content:'⌕';position:absolute;left:15px;top:50%;transform:translateY(-52%);color:var(--suave);font-size:1.1rem}
.res{position:absolute;top:calc(100% + 6px);left:0;right:0;border-radius:18px;overflow:hidden;max-height:340px;overflow-y:auto;display:none}.res.on{display:block}
.res button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:transparent;padding:10px 14px;text-align:left;cursor:pointer;font-size:.86rem}.res button:hover,.res button.act{background:rgba(255,255,255,.08)}.res small{color:var(--suave);margin-left:auto;font-size:.7rem}
.fab{position:absolute;right:12px;bottom:150px;z-index:5;display:flex;flex-direction:column;gap:8px}
.fab button{width:46px;height:46px;border-radius:50%;border:1px solid var(--borde);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);cursor:pointer;font-size:1.15rem;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fab button:hover{background:var(--glass2)}.fab .grande{background:var(--grad);color:#1a0f22;border:0}
.aqui .acc{margin-top:8px}.aqui .acc a,.aqui .acc button{font-size:.74rem;padding:6px 10px}
.maplibregl-ctrl-scale{background:rgba(14,10,24,.6);color:var(--suave);border-color:var(--suave)}
.giro{position:absolute;left:404px;bottom:150px;z-index:5;border-radius:22px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;user-select:none;-webkit-user-select:none}
.aro{width:96px;height:96px;border-radius:50%;position:relative;touch-action:none;cursor:grab;background:radial-gradient(circle,rgba(255,255,255,.06) 0 58%,transparent 59%),conic-gradient(from 0deg,rgba(255,201,60,.35),rgba(255,79,139,.35),rgba(124,247,255,.3),rgba(255,201,60,.35));box-shadow:inset 0 0 0 1px var(--borde)}
.aro:active{cursor:grabbing}.aguja{position:absolute;inset:8px;transition:transform .1s linear}.aguja:before{content:'N';position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:800;color:var(--sol)}
.aguja:after{content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom:12px solid var(--rosa)}
.perilla{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--grad);box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none;transition:transform .2s}
.gbtn{display:flex;gap:4px}.gbtn button{border:1px solid var(--borde);background:rgba(255,255,255,.06);border-radius:999px;padding:5px 9px;font-size:.7rem;cursor:pointer}.ginfo{font-size:.66rem;color:var(--suave)}
.aviso{position:absolute;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top,0px));z-index:7;padding:8px 16px;border-radius:999px;font-size:.82rem;display:none}
.maplibregl-popup-content{background:var(--glass2);color:var(--txt);border-radius:12px;font-family:inherit;font-size:.82rem;padding:8px 10px;border:1px solid var(--borde)}.maplibregl-popup-tip{display:none}
.maplibregl-ctrl-attrib{background:rgba(14,10,24,.6)!important;color:var(--suave)}.maplibregl-ctrl-attrib a{color:var(--suave)!important}
@media (max-width:820px){.giro{left:10px;bottom:250px;padding:8px}.panel:not(.min)~.giro,.panel:not(.min)~.fab{display:none}.ctrls{max-width:100%;overflow-x:auto;scrollbar-width:none}.ctrls::-webkit-scrollbar{display:none}.aro{width:84px;height:84px}.busca{flex-basis:100%;order:3}.top{flex-wrap:wrap}.fab{bottom:250px}
 .panel{left:0;right:0;width:auto;top:auto;bottom:0;height:44%;border-radius:24px 24px 0 0;transition:height .35s}
 .panel.min{height:118px}.tira{bottom:calc(44% + 8px);transition:bottom .35s}.panel.min~.tira{bottom:126px}
 .cajon{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:70%;transform:translateY(120%)}.cajon.on{transform:none}
 .ctrls button{padding:7px 9px;font-size:.74rem}.marca small{display:none}.lc{flex-basis:150px;height:96px}
 .asa{display:block!important}}
.asa{display:none;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:8px auto 0;border:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){.cajon,.panel,.tira{transition:none}.barra i{animation:none}}
</style>
</head>
<body>
<div id="map" role="region" aria-label="Mapa 3D de Medellín"></div>
<div class="intro" id="intro"><div><h1>La cadena</h1><p>Medellín, comuna por comuna · Observa Rigor</p><div class="barra"><i></i></div></div></div>
<div class="top">
 <a class="marca glass" href="../"><i></i>Observa Rigor <small>· La cadena, comuna por comuna</small></a><a class="marca glass" href="../contratacion/" style="font-size:.82rem">Contratación →</a>
 <div class="busca"><input id="q" type="search" placeholder="Buscar comuna, barrio, lugar o estación" autocomplete="off" aria-label="Buscar en el mapa"><div class="res glass" id="res" role="listbox"></div></div>
 <div class="ctrls glass" role="toolbar" aria-label="Vista">
  <button id="b-3d" aria-pressed="true">3D</button><button id="b-calle" aria-pressed="false">A pie de calle</button>
  <button id="b-tour" aria-pressed="false">▶ Recorrido</button><button id="b-tm" aria-pressed="true">Metro</button><button id="b-sat" aria-pressed="true">Satélite</button><button id="b-ed" aria-pressed="true">Edificios</button>
 </div>
</div>
<div class="aviso glass" id="aviso"></div>
<aside class="panel glass" id="panel">
 <button class="asa" id="asa" aria-label="Expandir o contraer el panel"></button>
 <div class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-t="explorar">Explorar</button><button role="tab" aria-selected="false" data-t="hallazgos">Hallazgos</button>
  <button role="tab" aria-selected="false" data-t="ranking">Ranking</button><button role="tab" aria-selected="false" data-t="voces">Voces</button>
 </div>
 <div class="cuerpo" id="v-explorar">
  <div id="chips"></div>
  <b id="ley-t" style="display:block;font-size:.88rem;margin-top:6px"></b><div class="rampa"></div><div class="ext"><span id="ley-min"></span><span id="ley-max"></span></div>
  <p class="que" id="ley-q"></p>
  <div class="lugarbox"><h2 id="lugar-n"></h2><p class="sub" id="lugar-t"></p><div class="cifras" id="cifras"></div><ul class="simple" id="simple"></ul></div>
 </div>
 <div class="cuerpo" id="v-hallazgos" hidden></div>
 <div class="cuerpo" id="v-ranking" hidden><h2 id="rk-t"></h2><p class="sub" id="rk-s"></p><div id="rk"></div><div id="rk-f"></div></div>
 <div class="cuerpo" id="v-voces" hidden><h2>Voces</h2><p class="sub">Lectura de fuentes, no medición. Cada voz parafraseada, con su enlace.</p><div id="voces"></div></div>
</aside>
<div class="giro glass" aria-label="Giroscopio: arrastrá para girar e inclinar"><div class="aro" id="aro" role="slider" aria-label="Girar e inclinar el mapa" tabindex="0"><div class="aguja" id="aguja"></div><div class="perilla" id="perilla"></div></div><span class="ginfo" id="ginfo"></span><div class="gbtn"><button id="g-arriba">Desde arriba</button><button id="g-3d">Vista 3D</button></div></div>
<div class="fab" aria-label="Controles del mapa"><button id="f-yo" title="Mi ubicación" aria-label="Mi ubicación">◎</button><button id="f-centro" title="Centrar en Medellín" aria-label="Centrar en Medellín">⌂</button><button id="f-norte" title="Apuntar al norte" aria-label="Apuntar al norte">➤</button><button id="f-mas" aria-label="Acercar">＋</button><button id="f-menos" aria-label="Alejar">－</button></div>
<div class="tira" id="tira" aria-label="Lugares"></div>
